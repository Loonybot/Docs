site_name: Loonybot Software
site_url: https://www.loonybot.com/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Sidekick RC:
      - sidekick-rc/index.md
      - GETTING STARTED:
          - sidekick-rc/getting-started/overview.md
          - sidekick-rc/getting-started/installation.md
      - USER GUIDE:
          - sidekick-rc/user-guide/usage.md
          - sidekick-rc/user-guide/disabling.md
      - API REFERENCE:
        - Configuration: sidekick-rc/configuration.md
      - FAQ: sidekick-rc/faq.md
      - Release Notes: sidekick-rc/release-notes.md
  - Additional Tools:
      - additional-tools/index.md
  - Blog:
      - blog/index.md

plugins:
  - search
  - blog:
      blog_dir: blog

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
